- date: 2026-07-18
  text: "I’m pleased to share that today I attended my graduation ceremony at the <strong>University of Oxford</strong>, marking the completion of my <strong>DPhil in Engineering Science</strong> and my doctoral research on <a href='https://ora.ox.ac.uk/objects/uuid:46e45162-4a3d-44a4-a9ed-48831017ff8f'><em>Causal Artificial Intelligence for Robust Robot Reasoning under Uncertainty</em></a>. I’m deeply grateful to my supervisors, <strong>Prof Lars Kunze</strong> and <strong>Prof Nick Hawes</strong>, and to the many collaborators and colleagues whose mentorship, support, and friendship made this journey possible."

- date: 2026-06-26
  text: "I’m thrilled to share that I have joined the core team at an <strong>AI Stealth Startup</strong> as a <strong>Founding Researcher</strong>. I’m excited to be part of the founding team on this new adventure, helping build a frontier AI lab from the ground up, and I can’t wait to see what we create together."

- date: 2026-04-23
  text: "I was thrilled to attend <strong>ICLR 2026</strong> in Rio de Janeiro, Brazil, where I presented <em>Multiverse Mechanica: A Testbed for Learning Game Mechanics via Counterfactual Worlds</em> during the poster session. It was a wonderful opportunity to share our work, discuss causal and generative world modelling with researchers from across the community, and reconnect with friends and collaborators."

- date: 2026-03-10
  text: "I’m delighted to share that I passed my Oxford DPhil viva! My thesis was examined by <strong>Prof Stephen Roberts</strong> as internal examiner and <strong>Prof Karinne Ramirez-Amaro</strong> of Chalmers University of Technology as external examiner. I’m very grateful to them for the thoughtful and engaging discussion."

- date: 2026-01-25
  text: "I’m excited to announce that my collaboration with <strong>Microsoft Research</strong> has resulted in a paper accepted at <strong>ICLR 2026</strong>: <em>Multiverse Mechanica: A Testbed for Learning Game Mechanics via Counterfactual Worlds</em>. The work introduces a causal generative modelling framework for learning and intervening on game mechanics, enabling counterfactually consistent parallel-world generation where only causally relevant factors change. <a href='https://openreview.net/pdf?id=5Q8r8ZubAH'>[Paper]</a>"

- date: 2025-10-10
  text: "I have submitted my Oxford DPhil (PhD) thesis and am currently awaiting my defence (March 2026)."

- date: 2025-09-05
  text: "I am absolutely delighted to share that our work on causal reasoning for robot manipulation has received the <strong>Best Paper Award</strong> at the European Conference on Mobile Robots 2025 (ECMR 2025) in Padua, Italy! This recognition means a lot - not just for the paper, but for the broader vision of building trustworthy, explainable, and robust autonomous robot systems. A huge thank you to my brilliant collaborators at the Oxford Robotics Institute, Microsoft Research, and Bristol Robotics Laboratory! <a href='https://www.linkedin.com/posts/ricardo-cannizzaro_ecmr2025-robotics-bestpaper-activity-7369709926157324289-ilLpE'>[LinkedIn post]</a>🏆🤖🎉"

- date: 2025-08-15
  text: "I was delighted to return to <strong>Microsoft Research</strong> (Redmond) to complete an <strong>advanced PhD Research Internship</strong>, where I extended my earlier work on causal and parallel-world consistency by developing mechanics-aware generative modelling frameworks and an instrumented interactive PyGame environment."

- date: 2024-08-16
  text: "I’m pleased to share that I completed my first PhD Research Internship at <strong>Microsoft Research</strong>, working with the same team on counterfactual consistency objectives for diffusion-based multi-modal generative models and human-aligned image fine-tuning."

- date: 2024-04-15
  text: "I’m happy to share our work was published at <strong>SEAMS 2024</strong>: <em>Aloft: Self-Adaptive Drone Controller Testbed</em>, introducing a testbed for studying self-adaptive control in autonomous aerial systems."

- date: 2023-01-05
  text: "I was honoured to give an invited talk at the <a href='https://sites.google.com/view/iros23-causal-robots'><strong>IROS 2023</strong></a> workshop on <em>Causality for Robotics</em>, presenting my work on confounded POMDP robot planning."

- date: 2023-10-02
  text: "I’m excited to share our paper was published at <strong>IROS 2023</strong>: <em>CAR-DESPOT: Causally-Informed Online POMDP Planning for Robots in Confounded Environments</em>, which integrates causal modelling into online planning under uncertainty."

- date: 2023-08-10
  text: "I am honoured and grateful to have received travel support to attend <strong>IROS 2023</strong>, supported by the IEEE Robot Learning Technical Committee, IEEE RAS member grants, and St Edmund Hall postgraduate funding."

- date: 2023-05-29
  text: "I co-organised the <strong>Multidisciplinary Approaches to Co-Creating Trustworthy Autonomous Systems (MACTAS)</strong> workshop at <strong>ICRA 2023</strong>, alongside Prof Lars Kunze. The workshop brought together keynote speakers, spotlight talks, and panel discussions to explore multidisciplinary perspectives on trust and trustworthiness in autonomous systems. <a href='https://lnkd.in/e7HYSJsY'>[Workshop]</a>"

- date: 2021-06-04
  text: "I was honoured to receive the <strong>Best Paper Award</strong> at the ICRA 2021 workshop on <a href='https://sites.google.com/view/realworldswarms/'>Robot Swarms in the Real World</a> for our work on multi-robot exploration."

- date: 2021-05-30
  text: "I’m happy to share our paper was published at <strong>ICRA 2021</strong>: <em>An Upper Confidence Bound for Simultaneous Exploration and Exploitation in Heterogeneous Multi-Robot Systems</em>, addressing scalable exploration–exploitation trade-offs in multi-robot teams."

- date: 2021-01-18
  text: "I’m excited to announce that I have started my DPhil (PhD) at the <strong>Oxford Robotics Institute</strong>, University of Oxford, with the <strong>Cognitive Robotics Group</strong>, supervised by Dr Lars Kunze and co-funded by the Australian Defence Science and Technology Group. My research focuses on probabilistic generative causal models for robust robot reasoning and decision-making under uncertainty."

- date: 2019-11-11
  text: "I’m pleased to share that our work was published at <strong>ACRA 2019</strong>, presenting a Random-Finite-Set-based SLAM approach for aerial robots operating with scanning and solid-state LIDARs."

- date: 2019-02-28
  text: "I’m happy to share that our paper was published at <strong>AIAC 2019</strong>, presenting an experimental evaluation of LIDAR and X-band radar sensing in particle-dense environments."

- date: 2018-05-25
  text: "I’m excited to share our paper was published at <strong>ICRA 2018</strong>, presenting scalable swarming and data-ferrying strategies for unmanned aerial systems."