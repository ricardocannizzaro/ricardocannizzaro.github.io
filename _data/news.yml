- date: 2026-01-25
  text: "Paper accepted at <strong>ICLR 2026</strong>: <em>Multiverse Mechanica</em>. The work introduces a causal generative modelling framework for learning and intervening on game mechanics, enabling counterfactually consistent parallel-world generation where only causally relevant factors change. <a href='https://openreview.net/pdf?id=5Q8r8ZubAH'>[Paper]</a>"
- date: 2025-10-10
  text: "Oxford PhD thesis submitted; awaiting defence."
- date: 2025-09-05
  text: "Absolutely delighted to share that our work on causal reasoning for robot manipulation has received the Best Paper Award at the European Conference on Mobile Robots 2025 (ECMR 2025) in Padua, Italy! This recognition means a lot - not just for the paper, but for the broader vision of building trustworthy, explainable, and robust autonomous robot systems. A huge thank you to my brilliant collaborators at the Oxford Robotics Institute, Microsoft Research, and Bristol Robotics Laboratory! <a href='https://www.linkedin.com/posts/ricardo-cannizzaro_ecmr2025-robotics-bestpaper-activity-7369709926157324289-ilLpE'>[LinkedIn post]</a>🏆🤖🎉"